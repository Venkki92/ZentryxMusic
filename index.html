<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Zentryx Music - Automotive Nextcloud DSP Audio Player</title>
    <meta name="description" content="Automotive 1024x600 8-inch Nextcloud music player with real-time 16-band Web Audio DSP, Pioneer TS-E170Ci tuning, Mercedes visualizers, and offline caching." />
    <meta property="og:title" content="Zentryx Music - Automotive Nextcloud DSP Audio Player" />
    <meta property="og:description" content="Automotive 1024x600 8-inch Nextcloud music player with real-time 16-band Web Audio DSP, Pioneer TS-E170Ci tuning, Mercedes visualizers, and offline caching." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zentryx" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body style="margin:0;background-color:#020617;color:#f1f5f9;">
    <div id="root">
      <div data-boot-placeholder="true" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#020617;color:#94a3b8;font-family:system-ui,sans-serif;">
        <div style="font-size:18px;font-weight:700;letter-spacing:0.04em;color:#f8fafc;">ZENTRYX MUSIC</div>
        <div style="font-size:12px;color:#64748b;">Starting automotive DSP cockpit...</div>
      </div>
    </div>
    <script>
      (function () {
        var shown = false;
        function isAppMounted() {
          var root = document.getElementById('root');
          if (!root) return false;
          return root.childElementCount > 0 && !root.querySelector('[data-boot-placeholder]');
        }
        function isIgnorableNoise(msg) {
          var text = String(msg || '');
          return /WebSocket|HMR|@vite\/client|ResizeObserver|ServiceWorker|dev-sw|AbortError/i.test(text);
        }
        function showBootError(msg) {
          if (shown || isIgnorableNoise(msg) || isAppMounted()) return;
          var root = document.getElementById('root');
          shown = true;
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#020617;color:#f1f5f9;font-family:system-ui,sans-serif;">' +
            '<div style="max-width:440px;width:100%;background:#0b1120;border:1px solid #1e293b;border-radius:16px;padding:24px;">' +
            '<h1 style="margin:0 0 8px;font-size:18px;font-weight:700;color:#fff;">Zentryx Music Recovery</h1>' +
            '<p style="margin:0 0 12px;font-size:12px;color:#94a3b8;">The cockpit UI failed to initialize:</p>' +
            '<pre style="margin:0 0 16px;padding:12px;border-radius:10px;background:#000;border:1px solid rgba(127,29,29,0.5);color:#fca5a5;font-size:11px;white-space:pre-wrap;overflow:auto;">' +
            String(msg || 'Unknown boot error').replace(/[<>&]/g, function (c) { return ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]); }) +
            '</pre>' +
            '<button type="button" onclick="window.location.reload()" style="padding:10px 16px;border-radius:10px;border:none;background:#a3e635;color:#000;font-weight:700;font-size:12px;cursor:pointer;">Reload Player</button>' +
            '</div></div>';
        }
        window.addEventListener('error', function (e) {
          var target = e && e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href || 'module asset';
            showBootError('Failed to load ' + src + ' (network/rate-limit error). Click Reload Player.');
            return;
          }
          showBootError(e && (e.message || (e.error && e.error.message)));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          showBootError(reason && (reason.message || String(reason)));
        });
        window.setTimeout(function () {
          if (!shown && !isAppMounted()) {
            showBootError('Preview connection timed out while booting modules (dev server may have restarted). Click Reload Player to reconnect.');
          }
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
